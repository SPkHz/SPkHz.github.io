version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: America/New_York
    groups:
      actions-routine:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: America/New_York
    groups:
      ruby-routine:
        applies-to: version-updates
        patterns: ["*"]
      ruby-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: America/New_York
    groups:
      quality-routine:
        applies-to: version-updates
        patterns: ["*"]
      quality-security:
        applies-to: security-updates
        patterns: ["*"]
