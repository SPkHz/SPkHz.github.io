name: Axe accessibility testing

on:
  # if you want to run this on every push uncomment the following lines
  # push:
  #   branches:
  #     - master
  #     - main
  # pull_request:
  #   branches:
  #     - master
  #     - main
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/)"
        required: false

env:
  URL: ""

permissions:
  contents: read

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          cache: "npm"
          cache-dependency-path: ".github/ci-tools/package-lock.json"
      - name: Install locked CI tools 💾
        run: |
          test "$(node --version)" = "v24.22.1"
          test "$(npm --version)" = "11.19.1"
          npm ci --prefix .github/ci-tools --ignore-scripts --no-audit --no-fund
      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true
      - name: Setup Python
        uses: ./.github/actions/setup-python # owned, qualified repair; see action PROVENANCE.json
        with:
          python-version: "3.13.18"
          cache: "pip"
          cache-dependency-path: .github/python-build-tools/requirements.lock
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          python -m pip install --require-hashes --only-binary=:all: --disable-pip-version-check -r .github/python-installer/requirements.lock
          python -m pip install --require-hashes --only-binary=:all: --disable-pip-version-check -r .github/python-build-tools/requirements.lock
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: .github/ci-tools/node_modules/.bin/purgecss -c purgecss.config.js
      - name: Prepare CI diagnostics 🧾
        run: |
          install -d -m 700 "$RUNNER_TEMP/axe-ci-diagnostics"
          {
            node --version
            npm --version
          } > "$RUNNER_TEMP/axe-ci-diagnostics/runtime.txt"
      - name: Prepare verified Chrome for Testing pair 🌐
        id: cft
        run: |
          python3 .github/ci-tools/cft_artifacts.py prepare \
            --manifest .github/ci-tools/chrome-for-testing.json \
            --cache-dir "$RUNNER_TEMP/cft-cache/156.0.8078.73-linux64" \
            --install-dir "$RUNNER_TEMP/cft/156.0.8078.73-linux64" \
            --output-json "$RUNNER_TEMP/axe-ci-diagnostics/cft-result.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Run axe 🪓
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        env:
          TARGET_PATH: ${{ github.event.inputs.url || env.URL }}
          CFT_CHROME_PATH: ${{ steps.cft.outputs.chrome-path }}
          CFT_CHROMEDRIVER_PATH: ${{ steps.cft.outputs.chromedriver-path }}
        run: |
          python3 .github/ci-tools/run-axe.py \
            --site-dir _site \
            --target-path "$TARGET_PATH" \
            --chrome "$CFT_CHROME_PATH" \
            --chromedriver "$CFT_CHROMEDRIVER_PATH" \
            --axe-source "$PWD/.github/ci-tools/node_modules/axe-core/axe.js" \
            --http-server "$PWD/.github/ci-tools/node_modules/.bin/http-server" \
            --axe "$PWD/.github/ci-tools/node_modules/.bin/axe" \
            --state-dir "$RUNNER_TEMP/axe-state" \
            --diagnostics-dir "$RUNNER_TEMP/axe-ci-diagnostics" \
            --result-json "$RUNNER_TEMP/axe-ci-diagnostics/axe-run.json" \
            --startup-timeout 30 \
            --axe-timeout 300
      - name: Upload axe diagnostics ⬆️
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: axe-ci-diagnostics
          path: ${{ runner.temp }}/axe-ci-diagnostics
          if-no-files-found: error
          retention-days: 90
