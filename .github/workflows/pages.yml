name: Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    env:
      BUNDLE_FROZEN: "true"
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - name: Install locked Node dependencies
        run: |
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.19.1"
          npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: 3.3.13
          bundler: 4.0.15
          bundler-cache: true
      - name: Verify ImageMagick
        run: |
          convert -version
          identify -version
      - uses: actions/configure-pages@v6.0.0
        with:
          enablement: false
      - name: Test security contracts
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          git ls-files -z '*.sh' | xargs -0 -r shellcheck
      - name: Build and validate publication
        run: |
          bundle _4.0.15_ exec jekyll build --trace
          npm run css:purge
          python3 -B scripts/validate_public_artifacts.py _site
          python3 -B scripts/validate_built_site.py _site
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
