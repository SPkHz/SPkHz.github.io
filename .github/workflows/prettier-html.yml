name: Prettify gh-pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lock-owning source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Install locked Prettier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Checkout gh-pages branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: true

      - name: Find and Remove </source> Tags
        working-directory: gh-pages
        run: find . -type f -name "*.html" -exec sed -i 's/<\/source>//g' {} +

      - name: Check for Prettier
        run: npx --no-install prettier --version

      - name: Run Prettier on HTML files
        run: npx --no-install prettier --write 'gh-pages/**/*.html'

      - name: Commit and push changes
        working-directory: gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Formatted HTML files" || echo "No changes to commit"
          git push
