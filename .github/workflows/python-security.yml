name: Python consumer security

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements.lock"
      - ".github/python-*/**"
      - ".github/workflows/*.yml"
      - "bin/update_scholar_citations.py"
      - "tests/tooling/test_python_consumers.py"
  push:
    branches: [main, master]
    paths:
      - "requirements.txt"
      - "requirements.lock"
      - ".github/python-*/**"
      - ".github/workflows/*.yml"
      - "bin/update_scholar_citations.py"
      - "tests/tooling/test_python_consumers.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lock: [requirements.lock, .github/python-build-tools/requirements.lock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python # owned, qualified repair
        with:
          python-version: "3.13.18"
      - name: Install frozen consumer and scanner
        env:
          LOCK_PATH: ${{ matrix.lock }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: --disable-pip-version-check -r .github/python-installer/requirements.lock
          python -m pip install --require-hashes --only-binary=:all: --disable-pip-version-check -r "$LOCK_PATH"
          python -m pip check
          python -m venv "$RUNNER_TEMP/python-audit"
          "$RUNNER_TEMP/python-audit/bin/python" -m pip install --require-hashes --only-binary=:all: --disable-pip-version-check -r .github/python-installer/requirements.lock
          "$RUNNER_TEMP/python-audit/bin/python" -m pip install --require-hashes --only-binary=:all: --disable-pip-version-check -r .github/python-audit-tools/requirements.lock
      - name: Test inert consumers
        run: python -m unittest discover -s tests/tooling -p test_python_consumers.py -v
      - name: Audit complete locks
        env:
          LOCK_PATH: ${{ matrix.lock }}
        run: |
          "$RUNNER_TEMP/python-audit/bin/python" -m pip_audit --disable-pip --no-deps --require-hashes --progress-spinner off -r "$LOCK_PATH"
          "$RUNNER_TEMP/python-audit/bin/python" -m pip_audit --disable-pip --no-deps --require-hashes --progress-spinner off -r .github/python-installer/requirements.lock
          "$RUNNER_TEMP/python-audit/bin/python" -m pip_audit --disable-pip --no-deps --require-hashes --progress-spinner off -r .github/python-audit-tools/requirements.lock
