name: Update TOCs
# This workflow automatically updates the Table of Contents (TOC) in markdown files

on:
  push:
    branches:
      - main
      - master
    paths:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # OR "2" -> To retrieve the preceding commit.

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: ./*.md
          json: true
          escape_json: false

      - name: Updated toc on all markdown changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          toc_dir=$(mktemp -d "$RUNNER_TEMP/verified-toc.XXXXXX")
          toc_tool="$toc_dir/gh-md-toc"
          export TOC_TOOL_PATH="$toc_tool"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/george-gca/github-markdown-toc/e9e9197682f98d98d22ea6f1ae39afd95a054481/gh-md-toc \
            --output "$toc_tool"
          printf '%s  %s\n' 8f36b5409a9ef5d4973c77cfa47d0be99cdfa22727467a611af3d47694936f20 "$toc_tool" | sha256sum --check --strict
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          root = Path.cwd()
          files = json.loads(os.environ["ALL_CHANGED_FILES"])
          if not isinstance(files, list) or not all(isinstance(name, str) for name in files):
              raise ValueError("expected changed-file JSON array")
          for name in files:
              source = root / name
              if source.suffix != ".md":
                  continue
              if source.is_symlink() or source.resolve().parent != root or not source.is_file():
                  raise ValueError("TOC source must be a regular root Markdown file")
              subprocess.run(["bash", os.environ["TOC_TOOL_PATH"],
                              "--indent", "2", "--insert", "--no-backup", "--hide-footer",
                              "./" + source.name], check=True)
          PYTHON

      - name: Commit changes
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: Auto update markdown TOC
