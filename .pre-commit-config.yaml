# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets
        entry: >-
          gitleaks git --staged --pre-commit --no-banner --redact
          --config=.gitleaks.toml --ignore-gitleaks-allow
          --max-decode-depth=3 --max-archive-depth=2
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: forbid-local-secret-files
        name: Block local environment, secret, and private-key files
        entry: >-
          python3 -c 'import sys; raise SystemExit("Local-only or private-key files cannot be committed:\n" + "\n".join(sys.argv[1:]))'
        language: system
        types: []
        files: >-
          (?ix)(^|/)(?:\.env(?:\..+)?|\.envrc(?:\..+)?|\.\.envrc\.sw.|\.envrc~|.*\.env|
          \.sops\.ya?ml|secrets/.*|\.claude/settings\.local\.json|\.codex/config\.toml|
          id_(?:rsa|dsa|ecdsa|ed25519)(?:\.pub)?|.*\.(?:p12|pfx|jks|keystore))$
        exclude: '(?i)^\.env(?:rc)?\.(?:example|sample|template)$'
        stages: [pre-commit]
