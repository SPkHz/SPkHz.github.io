# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: gitleaks-system
        name: gitleaks (system)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
      - id: prevent-plaintext-secret-files
        name: prevent plaintext secret files under secrets/
        entry: >-
          bash -lc 'for f in "$@"; do
          case "$f" in
            secrets/*)
              case "$f" in
                secrets/README.md|*.example|*.example.*|*.sops.env|*.sops.yaml|*.sops.yml|*.sops.json) ;;
                *) echo "plaintext secret file blocked: $f" >&2; exit 1 ;;
              esac
            ;;
          esac
          done' --
        language: system
        files: ^secrets/
      - id: validate-sops-secrets
        name: validate sops-encrypted secrets
        entry: >-
          bash -lc 'for f in "$@"; do
          [ -f "$f" ] || continue
          sops -d "$f" >/dev/null || exit 1
          done' --
        language: system
        files: ^secrets/.*\.sops\.(env|ya?ml|json)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
