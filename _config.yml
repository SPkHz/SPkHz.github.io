# -----------------------------------------------------------------------------
# Get external JSON data
# -----------------------------------------------------------------------------

jekyll_get_json:
  - data: resume
    json: assets/json/resume.json # it can also be an url

jsonresume:
  - basics
  - work
  - education
  - projects
  - volunteer
  - awards
  - certificates
  - skills
  - languages
  - interests
  - references
  # - publications
