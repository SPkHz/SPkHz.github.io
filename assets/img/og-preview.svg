<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient matching Deep Navy accent -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#1f4e79"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle grid pattern for engineering feel -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent line -->
  <rect x="80" y="200" width="6" height="230" fill="url(#accentGradient)" rx="3"/>

  <!-- Name -->
  <text x="110" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff">
    Steven M. Placzek
  </text>

  <!-- Title -->
  <text x="110" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#94a3b8">
    Electrical Engineer
  </text>

  <!-- Skills tagline -->
  <text x="110" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#2dd4bf">
    RF  •  DSP  •  Embedded  •  Millimeter-Wave  •  Test &amp; Measurement
  </text>

  <!-- Website URL -->
  <text x="110" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#64748b">
    spkhz.github.io
  </text>

  <!-- Circuit-inspired decorative elements -->
  <g stroke="#2dd4bf" stroke-width="2" fill="none" opacity="0.3">
    <circle cx="1050" cy="150" r="30"/>
    <line x1="1050" y1="120" x2="1050" y2="80"/>
    <line x1="1080" y1="150" x2="1120" y2="150"/>
    <circle cx="1100" cy="250" r="20"/>
    <line x1="1100" y1="230" x2="1100" y2="180"/>
    <rect x="1000" y="320" width="60" height="40" rx="5"/>
    <line x1="1060" y1="340" x2="1100" y2="340"/>
    <line x1="1000" y1="340" x2="960" y2="340"/>
  </g>
</svg>
